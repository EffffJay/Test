<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Circle Matrix Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 5px; color: #00e676; }
        .status { margin-bottom: 25px; color: #aaa; font-size: 14px; }
        button {
            background-color: #00e676;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.98); }
        .control-panel {
            background: #1e1e1e;
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .color-picker-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        input[type="color"] {
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        /* Grid Layout mapping your exact structural array */
        .matrix-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .pixel {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #333;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .pixel:active { transform: scale(0.85); }
    </style>
</head>
<body>

    <h1>Matrix Controller</h1>
    <div class="status" id="statusText">Disconnected</div>
    
    <button id="connectBtn" onclick="connectBLE()">Connect to ESP32</button>

    <div class="control-panel">
        <h3>1. Choose Color</h3>
        <div class="color-picker-wrapper">
            <input type="color" id="globalColor" value="#ffffff">
            <button style="background-color: #2979ff; color: white;" onclick="sendGroupColor()">Fill Entire Matrix</button>
        </div>

        <h3>2. Individual Control (Click Node)</h3>
        <div class="matrix-container">
            <!-- Row 1: 4 LEDs (Left to Right: 0,1,2,3) -->
            <div class="row">
                <div class="pixel" onclick="sendPixelColor(0)">0</div>
                <div class="pixel" onclick="sendPixelColor(1)">1</div>
                <div class="pixel" onclick="sendPixelColor(2)">2</div>
                <div class="pixel" onclick="sendPixelColor(3)">3</div>
            </div>
            <!-- Row 2: 7 LEDs (Serpentine Reverse: 10,9,8,7,6,5,4) -->
            <div class="row">
                <div class="pixel" onclick="sendPixelColor(10)">10</div>
                <div class="pixel" onclick="sendPixelColor(9)">9</div>
                <div class="pixel" onclick="sendPixelColor(8)">8</div>
                <div class="pixel" onclick="sendPixelColor(7)">7</div>
                <div class="pixel" onclick="sendPixelColor(6)">6</div>
                <div class="pixel" onclick="sendPixelColor(5)">5</div>
                <div class="pixel" onclick="sendPixelColor(4)">4</div>
            </div>
            <!-- Row 3: 8 LEDs (Standard Forward: 11 to 18) -->
            <div class="row">
                <div class="pixel" onclick="sendPixelColor(11)">11</div>
                <div class="pixel" onclick="sendPixelColor(12)">12</div>
                <div class="pixel" onclick="sendPixelColor(13)">13</div>
                <div class="pixel" onclick="sendPixelColor(14)">14</div>
                <div class="pixel" onclick="sendPixelColor(15)">15</div>
                <div class="pixel" onclick="sendPixelColor(16)">16</div>
                <div class="pixel" onclick="sendPixelColor(17)">17</div>
                <div class="pixel" onclick="sendPixelColor(18)">18</div>
            </div>
            <!-- Row 4: 7 LEDs (Serpentine Reverse: 25 down to 19) -->
            <div class="row">
                <div class="pixel" onclick="sendPixelColor(25)">25</div>
                <div class="pixel" onclick="sendPixelColor(24)">24</div>
                <div class="pixel" onclick="sendPixelColor(23)">23</div>
                <div class="pixel" onclick="sendPixelColor(22)">22</div>
                <div class="pixel" onclick="sendPixelColor(21)">21</div>
                <div class="pixel" onclick="sendPixelColor(20)">20</div>
                <div class="pixel" onclick="sendPixelColor(19)">19</div>
            </div>
            <!-- Row 5: 4 LEDs (Standard Forward: 26 to 29) -->
            <div class="row">
                <div class="pixel" onclick="sendPixelColor(26)">26</div>
                <div class="pixel" onclick="sendPixelColor(27)">27</div>
                <div class="pixel" onclick="sendPixelColor(28)">28</div>
                <div class="pixel" onclick="sendPixelColor(29)">29</div>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bleCharacteristic = null;

        async function connectBLE() {
            document.getElementById('statusText').innerText = "Searching for device...";
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_LED_Matrix' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('statusText').innerText = "Connected to Matrix!";
                document.getElementById('statusText').style.color = "#00e676";
                document.getElementById('connectBtn').style.display = "none";
            } catch (error) {
                console.log(error);
                document.getElementById('statusText').innerText = "Connection Failed. Try again.";
                document.getElementById('statusText').style.color = "#ff1744";
            }
        }

        // Helper function to extract Hex values to RGB components
        function getRGBValues() {
            const hex = document.getElementById('globalColor').value;
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return { r, g, b };
        }

        async function sendPixelColor(index) {
            if (!bleCharacteristic) { alert("Please connect to Bluetooth first!"); return; }
            const { r, g, b } = getRGBValues();
            
            // Construct 4-byte array buffer
            const data = new Uint8Array([index, r, g, b]);
            await bleCharacteristic.writeValue(data);
            
            // Update the UI circle color dynamically
            const pixels = document.querySelectorAll('.pixel');
            pixels.forEach(p => {
                if(parseInt(p.innerText) === index) {
                    p.style.backgroundColor = `rgb(${r},${g},${b})`;
                    // Flip text color clarity depending on brightness
                    p.style.color = (r+g+b > 400) ? 'black' : 'white';
                }
            });
        }

        async function sendGroupColor() {
            if (!bleCharacteristic) { alert("Please connect to Bluetooth first!"); return; }
            const { r, g, b } = getRGBValues();
            
            // Index 255 flags the firmware to change ALL LEDs
            const data = new Uint8Array([255, r, g, b]);
            await bleCharacteristic.writeValue(data);
            
            // Update all visual UI nodes at once
            const pixels = document.querySelectorAll('.pixel');
            pixels.forEach(p => {
                p.style.backgroundColor = `rgb(${r},${g},${b})`;
                p.style.color = (r+g+b > 400) ? 'black' : 'white';
            });
        }
    </script>
</body>
</html>
