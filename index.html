<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro BLE Matrix Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #0d0e12;
            color: #e4e6eb;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        h2 { margin: 5px 0; color: #2979ff; font-size: 22px; }
        .status-bar { font-size: 13px; color: #8a8d93; margin-bottom: 15px; }
        .panel {
            background: #16181d; width: 100%; max-width: 440px;
            padding: 15px; border-radius: 14px; box-sizing: border-box;
            margin-bottom: 15px; border: 1px solid #232730;
        }
        .section-title { font-size: 14px; font-weight: bold; text-transform: uppercase; color: #a1a5b0; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        /* Interactive Gradient Canvas Color Wheel */
        #colorCanvas {
            border-radius: 8px; width: 100%; height: 160px;
            cursor: crosshair; background: #000; display: block;
        }
        
        /* Multi-selection Grid Engine Setup */
        .matrix { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 15px 0; }
        .row { display: flex; justify-content: center; gap: 6px; }
        .pixel {
            width: 32px; height: 32px; border-radius: 50%;
            background: #252830; border: 2px solid #3c424e;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #a1a5b0;
            cursor: pointer; user-select: none; transition: all 0.1s ease;
        }
        .pixel.selected { border-color: #00e676; box-shadow: 0 0 8px #00e676; }
        
        /* Sliders & Controls */
        .slider-group { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
        .slider-group input { flex: 1; accent-color: #2979ff; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 5px; }
        button {
            background: #2979ff; color: white; border: none; padding: 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
        }
        button:active { filter: brightness(0.8); }
        button.alt { background: #252830; border: 1px solid #3c424e; color: #e4e6eb; }
        button.action { background: #00e676; color: #000; width: 100%; font-size: 15px; padding: 12px; border-radius: 25px; margin-bottom: 15px;}
        
        /* Digit selector list */
        .digit-strip { display: flex; justify-content: space-between; margin-top: 5px; gap: 4px; }
        .digit-btn { background: #232730; padding: 6px 10px; border-radius: 4px; font-size: 12px; flex: 1; color: white; border: 1px solid #3c424e; cursor: pointer;}
    </style>
</head>
<body>

    <h2>Matrix Dashboard</h2>
    <div class="status-bar" id="status">Status: Disconnected</div>
    <button class="action" id="connBtn" onclick="connect()">Connect BLE Hardware</button>

    <!-- Color Wheel Gradient Box Panel -->
    <div class="panel">
        <div class="section-title">1. Real-time Color Picker (HSV)</div>
        <canvas id="colorCanvas"></canvas>
        <div class="slider-group">
            <span>Brightness:</span>
            <input type="range" id="masterDim" min="0" max="255" value="255" oninput="sendBrightness(this.value)">
        </div>
    </div>

    <!-- Multi-Selection Layout Grid Setup -->
    <div class="panel">
        <div class="section-title">2. Matrix Node Mapping (Click to Select)</div>
        <div class="matrix">
            <div class="row" id="r1"></div>
            <div class="row" id="r2"></div>
            <div class="row" id="r3"></div>
            <div class="row" id="r4"></div>
            <div class="row" id="r5"></div>
        </div>
        <div class="btn-grid">
            <button class="alt" onclick="selectAll()">Select All</button>
            <button class="alt" onclick="clearSelection()">Clear Selection</button>
        </div>
        <button style="width:100%; margin-top:8px; background:#00e676; color:#000;" onclick="applyToSelected()">Apply Color to Selected Nodes</button>
    </div>

    <!-- System Features & 7-Segment Rendering -->
    <div class="panel">
        <div class="section-title">3. 7-Segment Digit Control</div>
        <div class="digit-strip">
            <button class="digit-btn" onclick="sendNumber(0)">0</button>
            <button class="digit-btn" onclick="sendNumber(1)">1</button>
            <button class="digit-btn" onclick="sendNumber(2)">2</button>
            <button class="digit-btn" onclick="sendNumber(3)">3</button>
            <button class="digit-btn" onclick="sendNumber(4)">4</button>
            <button class="digit-btn" onclick="sendNumber(5)">5</button>
            <button class="digit-btn" onclick="sendNumber(6)">6</button>
            <button class="digit-btn" onclick="sendNumber(7)">7</button>
            <button class="digit-btn" onclick="sendNumber(8)">8</button>
            <button class="digit-btn" onclick="sendNumber(9)">9</button>
        </div>
    </div>

    <div class="panel">
        <div class="section-title">4. FX Core Library Engines</div>
        <div class="btn-grid">
            <button onclick="sendAnim(1)">Rainbow Spectrum Wave</button>
            <button onclick="sendAnim(2)">Breathing Ambient Pulse</button>
        </div>
        <button class="alt" style="width:100%; margin-top:8px; color:#ff1744;" onclick="clearMatrix()">Shut Down / Clear All</button>
    </div>

    <script>
        const SUUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CUUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let txChar = null;
        let activeRGB = { r: 255, g: 255, b: 255 };
        let selectedPixels = new Set();

        // FIXED: Filled in your asymmetric serpentine layout indices correctly to stop syntax errors
        const gridSetup = {
            r1: [0, 1, 2, 3],
            r2: [10, 9, 8, 7, 6, 5, 4],
            r3: [11, 12, 13, 14, 15, 16, 17, 18],
            r4: [25, 24, 23, 22, 21, 20, 19],
            r5: [26, 27, 28, 29]
        };

        // Render Matrix nodes into DOM layout
        Object.keys(gridSetup).forEach(rowId => {
            const container = document.getElementById(rowId);
            gridSetup[rowId].forEach(index => {
                const d = document.createElement('div');
                d.className = 'pixel';
                d.id = 'p' + index;
                d.innerText = index;
                d.onclick = () => togglePixel(index);
                container.appendChild(d);
            });
        });

        // Initialize Spectrum Saturation Canvas Box
        const canvas = document.getElementById('colorCanvas');
        const ctx = canvas.getContext('2d');
        function drawCanvasGradients() {
            let hG = ctx.createLinearGradient(0, 0, canvas.width, 0);
            hG.addColorStop(0, '#f00'); hG.addColorStop(0.17, '#f0f'); hG.addColorStop(0.33, '#00f');
            hG.addColorStop(0.5, '#0cc'); hG.addColorStop(0.67, '#0f0'); hG.addColorStop(0.83, '#ff0'); hG.addColorStop(1, '#f00');
            ctx.fillStyle = hG; ctx.fillRect(0, 0, canvas.width, canvas.height);
            let vG = ctx.createLinearGradient(0, 0, 0, canvas.height);
            vG.addColorStop(0, 'rgba(255,255,255,1)'); vG.addColorStop(0.05, 'rgba(255,255,255,0.8)');
            vG.addColorStop(0.5, 'rgba(255,255,255,0)'); vG.addColorStop(0.95, 'rgba(0,0,0,0.8)'); vG.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = vG; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        canvas.width = 410; canvas.height = 160; drawCanvasGradients();

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left; const y = e.clientY - rect.top;
            const p = ctx.getImageData(x, y, 1, 1).data;
            activeRGB = { r: p[0], g: p[1], b: p[2] };
        });

        function togglePixel(i) {
            const el = document.getElementById('p' + i);
            if(selectedPixels.has(i)) { selectedPixels.delete(i); el.classList.remove('selected'); }
            else { selectedPixels.add(i); el.classList.add('selected'); }
        }
        function selectAll() { for(let i=0; i<30; i++) { selectedPixels.add(i); document.getElementById('p'+i).classList.add('selected'); }}
        function clearSelection() { selectedPixels.clear(); document.querySelectorAll('.pixel').forEach(p=>p.classList.remove('selected')); }

        // BLE Core Engine Transmission Blocks
        async function connect() {
            document.getElementById('status').innerText = "Connecting...";
            try {
                const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ESP32_LED_Matrix' }], optionalServices: [SUUID] });
                const srv = await dev.gatt.connect();
                const svc = await srv.getPrimaryService(SUUID);
                txChar = await svc.getCharacteristic(CUUID);
                document.getElementById('status').innerText = "Status: Connected to Matrix Core";
                document.getElementById('status').style.color = "#00e676";
                document.getElementById('connBtn').style.display = "none";
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Status: Connection Failed";
                document.getElementById('status').style.color = "#ff1744";
            }
        }

        async function tx(arr) { if(txChar) await txChar.writeValue(new Uint8Array(arr)); }
        function sendBrightness(v) { tx([100, parseInt(v)]); }
